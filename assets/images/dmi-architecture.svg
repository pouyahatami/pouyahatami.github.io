<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f5f7ff; stroke: #2454ff; stroke-width: 2; }
    .bus { fill: #dbe2ff; stroke: #2454ff; stroke-width: 1.6; }
    .title { font-size: 14px; font-weight: 600; fill: #12234f; }
    .label { font-size: 12px; fill: #3a4a75; }
    .busLabel { font-size: 13px; font-weight: 600; fill: #12234f; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .node { fill: #1c2440; stroke: #7c9bff; }
      .bus { fill: #2a3364; stroke: #7c9bff; }
      .title { fill: #f0f3ff; }
      .label { fill: #b7c2ea; }
      .busLabel { fill: #f0f3ff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="700" height="220"/>

  <text x="180" y="60" text-anchor="middle" class="label">Manager</text>
  <rect class="node" x="30" y="70" width="150" height="60" rx="8"/>
  <text x="105" y="106" text-anchor="middle" class="title">Debug Transport</text>
  <text x="105" y="122" text-anchor="middle" class="title">Module (DTM)</text>

  <rect class="bus" x="220" y="90" width="260" height="20" rx="10"/>
  <text x="350" y="80" text-anchor="middle" class="busLabel">DMI (Debug Module Interface)</text>

  <text x="595" y="60" text-anchor="middle" class="label">Subordinate</text>
  <rect class="node" x="520" y="70" width="150" height="60" rx="8"/>
  <text x="595" y="106" text-anchor="middle" class="title">Debug Module</text>
  <text x="595" y="122" text-anchor="middle" class="title">(DM)</text>
</svg>
