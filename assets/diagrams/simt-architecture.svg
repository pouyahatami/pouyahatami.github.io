<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Four-core SIMT matrix accelerator architecture</title>
  <desc id="desc">A dispatcher assigns work blocks to four compute cores. A round-robin arbiter connects the cores to shared operand and output memories, with host readback.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#91a7ff"/></marker>
    <style>
      .t{font:600 19px system-ui,sans-serif;fill:#f8fafc}.s{font:500 14px system-ui,sans-serif;fill:#cbd5e1}.k{font:700 13px system-ui,sans-serif;fill:#a5b4fc;letter-spacing:1px}.box{fill:#172554;stroke:#7c9cff;stroke-width:2}.mem{fill:#183247;stroke:#38bdf8;stroke-width:1.7}.bus{fill:none;stroke:#91a7ff;stroke-width:2.3}.line{fill:none;stroke:#91a7ff;stroke-width:2.3;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1120" height="520" rx="18" fill="#0f172a"/>
  <text x="44" y="48" class="k">SIMT MATRIX MULTIPLY ACCELERATOR</text>
  <g transform="translate(44 84)">
    <rect class="box" width="210" height="92" rx="10"/><text class="t" x="105" y="38" text-anchor="middle">Dispatcher FSM</text><text class="s" x="105" y="63" text-anchor="middle">work-block assignment</text>
    <path class="line" d="M210 46H275"/>
    <g transform="translate(280 0)">
      <rect class="box" width="180" height="76" rx="10"/><text class="t" x="90" y="31" text-anchor="middle">Core 0</text><text class="s" x="90" y="54" text-anchor="middle">scheduler + FMA</text>
      <rect class="box" y="92" width="180" height="76" rx="10"/><text class="t" x="90" y="123" text-anchor="middle">Core 1</text><text class="s" x="90" y="146" text-anchor="middle">scheduler + FMA</text>
      <rect class="box" y="184" width="180" height="76" rx="10"/><text class="t" x="90" y="215" text-anchor="middle">Core 2</text><text class="s" x="90" y="238" text-anchor="middle">scheduler + FMA</text>
      <rect class="box" y="276" width="180" height="76" rx="10"/><text class="t" x="90" y="307" text-anchor="middle">Core 3</text><text class="s" x="90" y="330" text-anchor="middle">scheduler + FMA</text>
    </g>
    <g transform="translate(530 86)"><rect class="box" width="210" height="180" rx="10"/><text class="t" x="105" y="70" text-anchor="middle">Round-robin</text><text class="t" x="105" y="95" text-anchor="middle">memory arbiter</text><text class="s" x="105" y="127" text-anchor="middle">read + write ports</text></g>
    <path class="bus" d="M460 38H500V176H514"/><path class="line" d="M514 176H526"/>
    <path class="bus" d="M460 130H490V176"/>
    <path class="bus" d="M460 222H490V176"/>
    <path class="bus" d="M460 314H500V176"/>
    <g transform="translate(812 12)">
      <rect class="mem" width="220" height="88" rx="10"/><text class="t" x="110" y="38" text-anchor="middle">Operand memory A</text><text class="s" x="110" y="62" text-anchor="middle">parameterized read latency</text>
      <rect class="mem" y="112" width="220" height="88" rx="10"/><text class="t" x="110" y="150" text-anchor="middle">Operand memory B</text><text class="s" x="110" y="174" text-anchor="middle">parameterized read latency</text>
      <rect class="mem" y="224" width="220" height="88" rx="10"/><text class="t" x="110" y="262" text-anchor="middle">Output memory C</text><text class="s" x="110" y="286" text-anchor="middle">golden-model readback</text>
    </g>
    <path class="bus" d="M740 132H780V56H796"/><path class="line" d="M796 56H808"/>
    <path class="bus" d="M740 176H780V156H796"/><path class="line" d="M796 156H808"/>
    <path class="bus" d="M740 220H780V280H796"/><path class="line" d="M796 280H808"/>
    <g transform="translate(530 326)"><rect x="0" y="0" width="502" height="64" rx="10" fill="#111c35" stroke="#3b82f6" stroke-dasharray="7 7"/><text class="t" x="165" y="40" text-anchor="middle">ModelSim verification</text><text class="s" x="390" y="40" text-anchor="middle">Quartus hardware readback</text></g>
  </g>
</svg>
